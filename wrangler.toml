name = "remit-rate-checker"
main = "worker/src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[[kv_namespaces]]
binding = "PUSH_KV"
id = "4353d85ebc96488792ec1bbd1a3aea53"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "RATE_HISTORY"
database_name = "remit-rate-history"
database_id = "56d530c8-9e53-4665-ba3d-848b715efa5e"

[triggers]
crons = ["*/5 * * * *", "0 12 * * *"]
