<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPY → PHP 送金レート比較</title>
<style>
  :root {
    --bg: #f2f5f7; --surface: #ffffff; --ink: #14232b; --muted: #5d6e77;
    --line: #d5dde2; --bar: #b9d3de; --best: #0f7a52; --best-bg: #e3f3ec; --err: #a33a2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181d; --surface: #172229; --ink: #e8eff2; --muted: #93a5ae;
      --line: #2a3a43; --bar: #2c4b59; --best: #4fcf96; --best-bg: #17332a; --err: #f08b7c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  .amount { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
  .amount label { color: var(--muted); }
  .amount input {
    width: 9ch; font: inherit; font-size: 1.4rem; font-variant-numeric: tabular-nums;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  .amount input:focus-visible { outline: 2px solid var(--best); outline-offset: 1px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    position: relative; overflow: hidden; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; gap: 2px 12px;
  }
  li .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); opacity: .45; z-index: 0; }
  li > *:not(.fill) { position: relative; z-index: 1; }
  li.best { border-color: var(--best); }
  li.best .fill { background: var(--best-bg); opacity: 1; }
  .name { font-weight: 600; }
  .name a { color: inherit; text-underline-offset: 3px; }
  .method { color: var(--muted); font-size: .85rem; }
  .got { text-align: right; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rate { text-align: right; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .tag { color: var(--best); font-size: .8rem; font-weight: 600; margin-left: 8px; }
  li.error { grid-template-columns: 1fr; color: var(--err); }
  footer { margin-top: 24px; color: var(--muted); font-size: .8rem; }
  footer p { margin: 4px 0; }

  li.error .name a {
  color: inherit;
  text-underline-offset: 3px;
  }

  li.error .method {
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>JPY → PHP 送金レート比較</h1>
  <p class="sub" id="updated">読み込み中…</p>

  <div class="amount">
    <label for="amt">送金額</label>
    <input id="amt" type="number" inputmode="numeric" min="1" step="1000" value="100000">
    <span>円</span>
  </div>

  <ol id="list" aria-live="polite"></ol>

  <footer>
    <p>表示は参考レートです。実際のレートは送金の成立時点で決まります。</p>
    <p>受取額は「金額 × レート」で、手数料は含みません。手数料は各社のページで確認してください。</p>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = null;

const fmt = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 0 });

function rows() {
  const out = [];
  for (const p of data.providers) {
    if (p.error) { out.push({ p, error: true }); continue; }
    for (const r of p.rates) out.push({ p, method: r.method, rate: r.rate });
  }
  return out;
}

function render() {
  const amount = Math.max(0, Number($("amt").value) || 0);
  const all = rows();
  const ok = all.filter((x) => !x.error).sort((a, b) => b.rate - a.rate);
  const failed = all.filter((x) => x.error);
  const top = ok.length ? ok[0].rate : 1;
  const list = $("list");
  list.textContent = "";

  ok.forEach((x, i) => {
    const li = document.createElement("li");
    if (i === 0) li.className = "best";
    const pct = Math.max(8, (x.rate / top) * 100);
    li.innerHTML = `
      <span class="fill" style="width:${pct}%"></span>
      <span class="name"><a href="${x.p.url}" target="_blank" rel="noopener">${x.p.name}</a>${i === 0 ? '<span class="tag">最も多い</span>' : ""}</span>
      <span class="got">${fmt.format(amount * x.rate)} PHP</span>
      <span class="method">${x.method}</span>
      <span class="rate">1 JPY = ${x.rate.toFixed(4)} PHP</span>`;
    list.appendChild(li);
  });


failed.forEach((x) => {
  const li = document.createElement("li");
  li.className = "error";

  li.innerHTML = `
    <span class="name">
      <a href="${x.p.url}" target="_blank" rel="noopener">
        ${x.p.name}
      </a>
    </span>
    <span class="method">レート取得失敗</span>
  `;

  list.appendChild(li);
});

}

fetch("rates.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((j) => {
    data = j;
    const d = new Date(j.updated);
    $("updated").textContent = "最終更新: " + d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", dateStyle: "medium", timeStyle: "short" }) + " (JST)";
    render();
  })
  .catch(() => { $("updated").textContent = "レートを読み込めませんでした。時間をおいて再読み込みしてください。"; });

$("amt").addEventListener("input", () => data && render());
</script>
</body>
</html>
