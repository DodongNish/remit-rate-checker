<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JPY → PHP 送金レート比較</title>
  <style>
    :root {
      --bg: #f2f5f7;
      --surface: #ffffff;
      --ink: #14232b;
      --muted: #5d6e77;
      --line: #d5dde2;
      --bar: #b9d3de;
      --best: #0f7a52;
      --best-bg: #e3f3ec;
      --err: #a33a2c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10181d;
        --surface: #172229;
        --ink: #e8eff2;
        --muted: #93a5ae;
        --line: #2a3a43;
        --bar: #2c4b59;
        --best: #4fcf96;
        --best-bg: #17332a;
        --err: #f08b7c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 56px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: .9rem;
    }

    ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 12px;
    }

    li .fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--bar);
      opacity: .45;
      z-index: 0;
    }

    li>*:not(.fill) {
      position: relative;
      z-index: 1;
    }

    li.best {
      border-color: var(--best);
    }

    li.best .fill {
      background: var(--best-bg);
      opacity: 1;
    }

    .name {
      font-weight: 600;
    }

    .name a {
      color: inherit;
      text-underline-offset: 3px;
    }

    .method {
      color: var(--muted);
      font-size: .85rem;
    }

    .rate {
      grid-row: 1 / span 2;
      grid-column: 2;
      text-align: right;
      font-size: 1.35rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .rate small {
      display: block;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 400;
    }

    .tag {
      color: var(--best);
      font-size: .8rem;
      font-weight: 600;
      margin-left: 8px;
    }

    li.error {
      grid-template-columns: 1fr;
      color: var(--err);
    }

    .manual {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .manual p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .85rem;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--best);
    }

    .btn:focus-visible {
      outline: 2px solid var(--best);
      outline-offset: 2px;
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: .8rem;
    }

    footer p {
      margin: 4px 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>JPY → PHP 送金レート比較</h1>
    <p class="sub" id="updated">読み込み中…</p>

    <ol id="list" aria-live="polite"></ol>

    <section class="manual">
      <p>自動取得できない会社(公式ページで確認してください)</p>
      <a class="btn" href="https://www.remit.co.jp/en/kaigaisoukin/exchangeratecommission/exchange/" target="_blank"
        rel="noopener">SBI Remit のレートを見る ↗</a>
    </section>

    <footer>
      <p>表示は参考レートです。実際のレートは送金の成立時点で決まります。</p>
      <p>手数料は含みません。手数料は各社のページで確認してください。</p>
    </footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function rows(data) {
      const out = [];
      for (const p of data.providers) {
        if (p.error) { out.push({ p, error: true }); continue; }
        for (const r of p.rates) out.push({ p, method: r.method, rate: r.rate });
      }
      return out;
    }

    function render(data) {
      const all = rows(data);
      const ok = all.filter((x) => !x.error).sort((a, b) => b.rate - a.rate);
      const failed = all.filter((x) => x.error);
      const top = ok.length ? ok[0].rate : 1;
      const list = $("list");
      list.textContent = "";

      ok.forEach((x, i) => {
        const li = document.createElement("li");
        if (i === 0) li.className = "best";
        const pct = Math.max(8, (x.rate / top) * 100);
        li.innerHTML = `
      <span class="fill" style="width:${pct}%"></span>
      <span class="name"><a href="${x.p.url}" target="_blank" rel="noopener">${x.p.name}</a>${i === 0 ? '<span class="tag">最も高い</span>' : ""}</span>
      <span class="method">${x.method}</span>
      <span class="rate">${x.rate.toFixed(4)}<small>PHP / 1 JPY</small></span>`;
        list.appendChild(li);
      });

      failed.forEach((x) => {
        const li = document.createElement("li");
        li.className = "error";
        li.textContent = `${x.p.name}: 今回は取得できませんでした`;
        list.appendChild(li);
      });
    }

    fetch("rates.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((j) => {
        const d = new Date(j.updated);
        $("updated").textContent = "最終更新: " + d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", dateStyle: "medium", timeStyle: "short" }) + " (JST)";
        render(j);
      })
      .catch(() => { $("updated").textContent = "レートを読み込めませんでした。時間をおいて再読み込みしてください。"; });
  </script>
</body>

</html>
